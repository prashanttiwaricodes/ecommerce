{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Edit Your Review</h2>

<div class="card">
    <div class="card-body">
        <h5 class="card-title">
            {{ review.product.name }}
        </h5>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">Update Review</button>
            <a href="{% url 'products:detail' review.product.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
