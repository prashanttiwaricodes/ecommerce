{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Commerce Store{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">E-Commerce</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">


                <div class="ms-auto">
                
                   <a href="{% url 'home' %}"
                     class="btn btn-outline-light">Dashboard</a>
                </div>

                  <div class="ms-auto">
                     <a href="{% url 'cart:detail' %}"
                        class="btn btn-outline-light">Cart</a>
                </div>
             </ul>
             {% if user.is_authenticated %}
             <span class="navbar-text me-3">
                Hi, {{ user.email }}
             </span>
             <a class="btn btn-secondary me-2" href="{% url 'orders:list' %}">My Orders</a>
             <a class="btn btn-outline-danger" href="{% url 'accounts:logout' %}">Logout</a>
              {% else %}
              <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Login</a>
              {% endif %}
            </div>
        </div>

    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    
</body>
</html>
