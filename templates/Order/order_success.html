{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="alert alert-success">
        <h4 class="alert-heading">Order placed successfully 🎉</h4>
        <p>
            Your order number is<strong>#{{ order.id }}</strong>
        </p>
        <hr>
        <p class="mb-0">Total:<strong>₹{{ order.total_amount|floatformat:2 }}</strong></p>
    </div>
    <a href="{% url 'products:list' %}" class="btn btn-primary">Continue Shopping</a>
</div>
{% endblock %}
